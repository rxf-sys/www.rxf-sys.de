name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    name: Validate HTML
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Install html-validate
        run: npm install -g html-validate

      - name: Validate HTML
        # continue-on-error: bestehende Violations blockieren nicht — nach
        # erstem Durchlauf auf false setzen, wenn alle Fehler behoben sind.
        run: html-validate "*.html"
        continue-on-error: true

  links:
    name: Check Links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Lychee link check
        uses: lycheeverse/lychee-action@v2
        with:
          args: >
            --no-progress
            --exclude-mail
            '*.html'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
